name: Temporary source fix

on:
  push:
    branches:
      - fix/windows-dynamic-backend-dll-search

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply missing preprocessor guard fix
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/transcription-filter.cpp')
          text = path.read_text(encoding='utf-8')
          old = "#endif\n\n    // Enumerate backend devices to populate list\n"
          new = "#endif\n#endif\n\n\t// Enumerate backend devices to populate list\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected source block exactly once, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

      - name: Format source with repository clang-format
        shell: bash
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap obsproject/tools
          brew install zsh obsproject/tools/clang-format@16
          export PATH="/home/linuxbrew/.linuxbrew/opt/clang-format@16/bin:$PATH"
          ./build-aux/run-clang-format

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          git diff --exit-code -- . ':!src/transcription-filter.cpp' || {
            echo 'Formatter changed files outside src/transcription-filter.cpp' >&2
            exit 1
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/transcription-filter.cpp
          git commit -m 'fix: correct Windows dynamic backend guard and formatting'
          git push
